<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>할일 목록</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="welcome-screen" id="welcomeScreen">
      <div class="welcome-content">
        <div class="welcome-icon">✓</div>
        <h1 class="welcome-title">TodoList에 오신 것을 환영합니다!</h1>
        <p class="welcome-desc">할일을 추가하고, 수정하고, 완료 표시까지<br />한곳에서 관리해 보세요.</p>
        <button type="button" class="btn btn-primary welcome-btn" id="startBtn">
          할일 목록 시작하기
        </button>
      </div>
    </section>

    <section class="auth-screen" id="authScreen" hidden>
      <div class="auth-card">
        <h2 class="auth-title" id="authTitle">로그인</h2>
        <p class="auth-subtitle" id="authSubtitle">할일 목록을 사용하려면 로그인하세요</p>
        <form class="auth-form" id="authForm">
          <input
            type="email"
            id="authEmail"
            class="todo-input auth-input"
            placeholder="이메일"
            autocomplete="email"
            required
          />
          <input
            type="password"
            id="authPassword"
            class="todo-input auth-input"
            placeholder="비밀번호 (6자 이상)"
            autocomplete="current-password"
            minlength="6"
            required
          />
          <p class="auth-error" id="authError" hidden></p>
          <button type="submit" class="btn btn-primary auth-submit" id="authSubmitBtn">
            로그인
          </button>
        </form>
        <p class="auth-toggle">
          <span id="authToggleText">계정이 없으신가요?</span>
          <button type="button" class="btn btn-text" id="authToggleBtn">회원가입</button>
        </p>
      </div>
    </section>

    <div class="app" id="todoApp" hidden>
      <div class="app-bar">
        <div class="user-info">
          <span class="user-label">로그인됨</span>
          <span class="user-email" id="userEmail"></span>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="logoutBtn">로그아웃</button>
      </div>

      <header class="header">
        <h1 class="title">할일 목록</h1>
        <p class="subtitle">오늘 해야 할 일을 관리하세요</p>
      </header>

      <form class="add-form" id="addForm">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="새 할일을 입력하세요..."
          autocomplete="off"
          maxlength="200"
        />
        <button type="submit" class="btn btn-primary">추가</button>
      </form>

      <div class="filter-bar">
        <button type="button" class="filter-btn active" data-filter="all">전체</button>
        <button type="button" class="filter-btn" data-filter="active">진행 중</button>
        <button type="button" class="filter-btn" data-filter="completed">완료</button>
      </div>

      <div class="todo-section">
        <p class="section-hint">할일을 아래 카테고리로 드래그해서 분류할 수 있습니다.</p>
        <ul class="todo-list todo-drop-zone" id="todoList" data-drop-category=""></ul>
      </div>

      <footer class="footer" id="footer" hidden>
        <span class="todo-count" id="todoCount"></span>
        <button type="button" class="btn btn-text" id="clearCompleted">
          완료 항목 삭제
        </button>
      </footer>

      <section class="categories-section">
        <div class="categories-header">
          <h2 class="categories-title">카테고리</h2>
          <p class="categories-subtitle">할일을 드래그해서 원하는 카테고리에 넣으세요</p>
        </div>
        <div class="categories-grid" id="categoriesGrid"></div>
      </section>
    </div>

    <div class="modal" id="editModal" hidden>
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-content" role="dialog" aria-labelledby="modalTitle">
        <h2 class="modal-title" id="modalTitle">할일 수정</h2>
        <form id="editForm">
          <input
            type="text"
            id="editInput"
            class="todo-input"
            maxlength="200"
            required
          />
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelEdit">
              취소
            </button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
